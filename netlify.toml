[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/review/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/review/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/r/*"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
